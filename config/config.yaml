# =============================================================================
# X-Former 统一配置文件
# 跨模态信息瓶颈网络 — 第二篇论文
# 所有超参数集中管理于此文件
# =============================================================================

# ---------------------------------------------------------------------------
# 路径配置 (相对于项目根目录)
# ---------------------------------------------------------------------------
paths:
  data_root: "./datasets"
  results_root: "./results"
  pretrained_swin: "./pretrained/model_swinvit.pt"  # 从第一篇 model/ 复制，缺失则从头训练

# ---------------------------------------------------------------------------
# 数据集配置
# ---------------------------------------------------------------------------
datasets:
  77sets:
    name: "77sets"
    modality: "MRI"
    image_dir: "77sets/Image"
    clinical_file: "77sets/Clinical/clinical.csv"
    radiomics_dir: "77sets/Radiomics"
    image_shape: [256, 256, 19]
    radiomics_n_features: 16

  isle2024:
    name: "ISLE2024"
    modality: "CT"
    image_dir: "ISLE2024/Image_Brain"
    image_lesion_dir: "ISLE2024/Image_Lesion"
    clinical_file: "ISLE2024/Clinical/clinical_isle_2024_brain.csv"
    radiomics_brain_dir: "ISLE2024/Radiomics_Brain"
    radiomics_lesion_dir: "ISLE2024/Radiomics_Lesion"
    image_shape: [512, 704, 84]
    radiomics_n_features: 15
    lesion_n_features: 6

# ---------------------------------------------------------------------------
# 图像预处理
# ---------------------------------------------------------------------------
image:
  target_shape: [64, 160, 160]
  multi_window:
    - [40, 80]
    - [80, 200]
    - [40, 380]

# ---------------------------------------------------------------------------
# 采样配置
# ---------------------------------------------------------------------------
sampling:
  strategy: "balanced_full"  # V10: ISLE全量一次，77sets replacement补齐
  augment_77: 1
  augment_isle: 1
  replacement_77: true
  replacement_isle: false
  balance_77_classes: true
  seed: 42

# ---------------------------------------------------------------------------
# 模型超参数
# ---------------------------------------------------------------------------
model:
  image:
    perceiver_latents: 32
    perceiver_dim: 256
    swin_freeze_layers: 2  # V5: 恢复V2架构
    swin_pretrained: true  # Set to true after placing model_swinvit.pt in pretrained/

  clinical:
    n_prototypes: 8  # V5: 恢复V2容量
    proto_dim: 128
    use_dataset_embedding: true

  radiomics:
    proj_dim: 128
    temporal_nhead: 4
    temporal_nlayers: 2
    temporal_dropout: 0.1

  bottleneck:
    n_slots: 8  # V5: 恢复V2瓶颈容量
    n_layers: 4
    dim: 256
    nhead: 8
    dropout: 0.1
    ff_expansion: 4

  classifier:
    hidden_dims: [256, 128]
    dropout: 0.3  # V5: 恢复V2水平
    adapter:
      enabled: false  # V10-no-adapter-lowC-minckpt：adapter已证实拉低pooled AUC
      embedding_dim: 8
      hidden_dim: 64
      scale: 0.1

# ---------------------------------------------------------------------------
# 训练超参数
# ---------------------------------------------------------------------------
training:
  batch_size: 4  # V10-sanity基线：小样本更稳定，每batch约2+2
  accumulation_steps: 8  # V10-sanity基线：保持有效batch=32
  max_epochs: 120
  early_stop_patience: 25
  min_checkpoint_epoch: 25  # 在V10-sanity基础上加入，避开warmup前早期尖峰
  checkpoint_selection:
    metric: "balanced_auc"  # 按双数据集均衡分数保存best，避免只优化混合val AUC
    gap_penalty: 0.25  # score = mean(77, ISLE) - penalty * |77 - ISLE|

  optimizer:
    name: "adamw"
    lr: 3.0e-5
    weight_decay: 0.08  # V10: 针对V9 loss快速归零加强正则
    betas: [0.9, 0.999]

  scheduler:
    name: "cosine"
    T_0: 15
    T_mult: 2
    eta_min: 1.0e-7
    warmup_epochs: 8
    T_max: 120

  mixed_precision: true
  grad_clip_norm: 1.0

  # 多卡训练 (DDP)
  ddp:
    enabled: false
    backend: "nccl"
    find_unused_parameters: false

# ---------------------------------------------------------------------------
# 损失权重
# ---------------------------------------------------------------------------
losses:
  focal:
    alpha: 0.80
    gamma: 1.5
    weight: 1.0

  domain:
    weight: 0.01  # V10: 弱域正则，不让GRL主导瓶颈
    grl_lambda: 0.05

  contrastive:
    weight: 0.005  # V10-sanity基线：轻量跨模态对齐
    temperature: 0.1
    same_dataset_positive_weight: 0.5  # 同标签同数据集弱正样本
    cross_dataset_positive_weight: 1.0  # 同标签跨数据集强正样本

  consistency:
    weight: 0.0  # V10全脑-only：不使用lesion相关一致性约束

  warmup:
    enabled: true
    contrastive_start_epoch: 10
    contrastive_ramp_epochs: 30
    domain_start_epoch: 20
    domain_ramp_epochs: 20
    consistency_start_epoch: 0
    consistency_ramp_epochs: 1

# ---------------------------------------------------------------------------
# 交叉验证
# ---------------------------------------------------------------------------
crossval:
  n_folds: 5
  test_size: 0.2
  seed: 42

# ---------------------------------------------------------------------------
# 评估
# ---------------------------------------------------------------------------
eval:
  bootstrap_n: 1000
  ci_alpha: 0.05
  tta: true
  threshold_search:
    start: 0.1
    end: 0.9
    step: 0.01
    metric: "f1_macro"

# ---------------------------------------------------------------------------
# 消融控制 (由 crossval_joint.py 读取控制模块开关)
# ---------------------------------------------------------------------------
ablation:
  use_bottleneck: true
  use_perceiver: true
  use_domain_loss: true  # V10: 弱域正则
  use_contrastive_loss: true  # V10: 极轻量对比约束
  use_consistency_loss: false  # V10全脑-only，不使用lesion
  use_lesion: false  # 第一篇未使用且当前lesion数据不规范，主实验关闭
  use_proto_clinical: true
  joint_training: true
